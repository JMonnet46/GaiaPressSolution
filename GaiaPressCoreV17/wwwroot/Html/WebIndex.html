<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GaiaPress - Gestion des Chantier</title>
    <!-- Bootstrap pour un design moderne -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- jsTree pour l'arborescence -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jstree/3.2.1/themes/default/style.min.css" />
    <!-- DataTables pour les iTableaux -->
    <link rel="stylesheet" href="https://cdn.DataTables.net/1.13.6/css/jquery.DataTables.min.css" />
    <style>
        /* Styles personnalisés */
        #tvArborescence {
            border: 1px solid #ddd;
            padding: 10px;
            min-height: 200px;
            background-color: #f9f9f9;
        }

        .form-container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .btn-action {
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <h1 class="text-center my-4">GaiaPress - Gestion des Chantier</h1>

        <!-- Onglets (remplace iTabChantier) -->
        <ul class="nav nav-iTabs" id="chantieriTabs" role="iTablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="iTabChantier" data-bs-toggle="iTab" data-bs-target="#iTabChantierContent" type="button" role="iTab">Chantier</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="iTabForages" data-bs-toggle="iTab" data-bs-target="#iTabForagesContent" type="button" role="iTab">Forages</button>
            </li>
        </ul>

        <!-- Contenu des onglets -->
        <div class="iTab-content" id="chantieriTabsContent">
            <!-- Onglet Chantier -->
            <div class="iTab-pane fade show active" id="iTabChantierContent" role="iTabpanel">
                <div class="form-container">
                    <h2>Propriétés du chantier</h2>
                    <form id="chantierForm">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="txtRefChantier" class="form-label">Référence du chantier :</label>
                                <input type="text" class="form-control" id="txtRefChantier" readonly>
                            </div>
                            <div class="col-md-6">
                                <label for="txtNomChantier" class="form-label">Nom du chantier :</label>
                                <input type="text" class="form-control" id="txtNomChantier" readonly>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="txtRefClient" class="form-label">Référence du client :</label>
                                <input type="text" class="form-control" id="txtRefClient" readonly>
                            </div>
                            <div class="col-md-6">
                                <label for="txtEntreprise" class="form-label">Entreprise :</label>
                                <input type="text" class="form-control" id="txtEntreprise" readonly>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="txtTelephone" class="form-label">Téléphone :</label>
                                <input type="text" class="form-control" id="txtTelephone" readonly>
                            </div>
                            <div class="col-md-6">
                                <label for="txtAdresse" class="form-label">Adresse :</label>
                                <input type="text" class="form-control" id="txtAdresse" readonly>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="txtDescription" class="form-label">Description :</label>
                            <textarea class="form-control" id="txtDescription" rows="3" readonly></textarea>
                        </div>
                    </form>

                    <!-- Arborescence (remplace TreeView) -->
                    <div class="mb-4">
                        <h3>Arborescence</h3>
                        <div id="tvArborescence"></div>
                    </div>

                    <!-- Boutons -->
                    <div class="d-flex justify-content-between">
                        <div>
                            <button type="button" class="btn btn-primary btn-action" id="btnModifier">Modifier</button>
                            <button type="button" class="btn btn-success btn-action" id="btnOk" disabled>OK</button>
                            <button type="button" class="btn btn-secondary btn-action" id="btnAnnuler" disabled>Annuler</button>
                        </div>
                        <div>
                            <button type="button" class="btn btn-info btn-action" id="btnImprimer">Imprimer</button>
                            <button type="button" class="btn btn-danger btn-action" id="btnFermer">Fermer</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Onglet Forages -->
            <div class="iTab-pane fade" id="iTabForagesContent" role="iTabpanel">
                <div class="form-container">
                    <h2>Liste des forages</h2>
                    <div class="mb-3">
                        <button type="button" class="btn btn-primary btn-action" id="btnAddForage">Add</button>
                        <button type="button" class="btn btn-warning btn-action" id="btnOuvrirForage">Ouvrir</button>
                        <button type="button" class="btn btn-danger btn-action" id="btnDeleteForage">Delete</button>
                    </div>
                    <iTable id="dataGridForages" class="iTable iTable-striped iTable-bordered" style="width:100%">
                        <thead>
                            <tr>
                                <th>Référence</th>
                                <th>Nom</th>
                                <th>Date</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </iTable>
                </div>
            </div>
        </div>
    </div>

    <!-- Modales (pour les confirmations, etc.) -->
    <div class="modal fade" id="confirmModal" iTabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Confirmation</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="confirmModalBody">
                    <!-- Message dynamique -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Non</button>
                    <button type="button" class="btn btn-primary" id="confirmModalYes">Oui</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bibliothèques JS -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jstree/3.2.1/jstree.min.js"></script>
    <script src="https://cdn.DataTables.net/1.13.6/js/jquery.DataTables.min.js"></script>
    <script src="/js/chantier.js"></script>
</body>
</html>
